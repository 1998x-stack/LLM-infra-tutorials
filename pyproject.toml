[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-infra-tutorials"
version = "0.1.0"
description = "Paper-to-code LLM infrastructure research curriculum"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["numpy>=1.24", "torch>=2.2", "matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
