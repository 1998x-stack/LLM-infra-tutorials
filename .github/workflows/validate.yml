name: repository-validation
on:
  push:
  pull_request:
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repository structure and research contracts
        run: python3 scripts/validate_repo.py
      - name: Canonical-to-client skill sync integrity
        run: python3 scripts/sync_agent_skills.py --check
      - name: Skill routing fixture syntax (not model invocation)
        run: python3 scripts/validate_skill_cases.py
      - name: Knowledge JSONL source-derived status integrity
        run: python3 scripts/build_knowledge_index.py --check
      - name: Offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n scripts/download_papers.sh
          for f in stages/*/papers/core/download.sh; do bash -n "$f"; done
      - name: Offline PDF preview
        run: bash scripts/download_papers.sh --all --dry-run > /dev/null

